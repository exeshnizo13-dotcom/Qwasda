[project]
name = "Qwasda"
dynamic = ["version"]
description = "Універсальний перемикач розкладки для Windows з автокорекцією"
authors = [{name = "exeshnizo13"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "types-psutil>=5.9",
    "ruff>=0.3",
    "black>=24.0",
    "pre-commit>=3.6",
]

[project.scripts]
qwasda = "qwasda.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
python_version = "3.11"
namespace_packages = true
exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
fixable = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
per-file-ignores = { "qwasda/__init__.py" = ["F401"], "qwasda.py" = ["ALL"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "qwasda.version.__version__"}

[tool.setuptools.packages.find]
include = ["qwasda*"]
