[project]
name = "Qwasda"
version = "1.3.1"
description = "Універсальний перемикач розкладки для Windows з автокорекцією"
authors = [{name = "exeshnizo13"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
