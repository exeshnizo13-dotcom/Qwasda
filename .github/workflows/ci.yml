name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff black mypy types-psutil pyinstaller

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run black (format check)
        run: black --check .

      - name: Run mypy (type check)
        run: mypy qwasda

      - name: Run tests
        run: pytest tests/ -v --cov=qwasda --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-release.txt
          choco install nsis --version=3.12 --no-progress -y

      - name: Build portable EXE and NSIS installer
        run: |
          python release.py

      - name: Verify packaged CLI
        run: |
          ./artifacts/Qwasda-1.4.0-x64.exe --version
          ./artifacts/Qwasda-1.4.0-x64.exe --smoke-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qwasda-package-${{ github.sha }}
          path: artifacts/*
          retention-days: 7
