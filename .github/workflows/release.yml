name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      QWASDA_SIGNTOOL_CERT: ${{ secrets.QWASDA_SIGNTOOL_CERT }}
      QWASDA_SIGNTOOL_PASSWORD: ${{ secrets.QWASDA_SIGNTOOL_PASSWORD }}
      QWASDA_UPDATE_SIGNING_KEY: ${{ secrets.QWASDA_UPDATE_SIGNING_KEY }}
      QWASDA_REQUIRE_UPDATE_SIGNATURE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-release.txt
          choco install nsis --version=3.12 --no-progress -y

      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $projectVersion = (Get-Content qwasda/version.py | Select-String '__version__').ToString() -replace '.*"([0-9.]+)".*', '$1'
          if ($tagVersion -ne $projectVersion) { throw "Tag $tagVersion does not match project version $projectVersion" }

      - name: Build portable EXE and NSIS installer
        run: |
          python release.py

      - name: Verify packaged CLI
        run: |
          ./artifacts/Qwasda-1.5.0-x64.exe --version
          ./artifacts/Qwasda-1.5.0-x64.exe --smoke-test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Qwasda v${{ github.ref_name }}
          body: |
            ## Qwasda v${{ github.ref_name }}

            Автоматичне визначення та перемикання розкладки клавіатури між українською та англійською.

            ### Завантаження
            - `Qwasda-1.5.0-x64.exe` — portable-виконавчий файл
            - `Qwasda-Setup-1.5.0-x64.exe` — per-user інсталятор
            - Контрольні суми: `SHA256SUMS.txt`

            ### Встановлення
            1. Завантажте та запустіть `Qwasda-Setup-1.5.0-x64.exe`
            2. За потреби виберіть автозапуск Windows
            3. Для portable-режиму запустіть `Qwasda-1.5.0-x64.exe`

            ### Перевірка цілісності
            ```powershell
            certutil -hashfile Qwasda-Setup-1.4.0-x64.exe SHA256
            ```
            Порівняйте з вмістом `SHA256SUMS.txt`.

          draft: false
          prerelease: false
          files: |
            artifacts/Qwasda-1.5.0-x64.exe
            artifacts/Qwasda-Setup-1.5.0-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/update-manifest.json
            artifacts/update-manifest.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
